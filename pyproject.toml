[project]
name = "jev-as-a-judge"
version = "0.1.0"
description = "DeepAgents weather agent with Tavily and LangSmith evals"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.3.0",
    "langchain-openai>=0.3.0",
    "langsmith>=0.3.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.5.0",
    "typesafe-sdk>=0.6.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_agent", "src/evals"]
